[project]
name = "orchestrator2"
version = "0.1.0"
description = "POC for sequential agents and custom executors with audio streaming"
requires-python = ">=3.10"
dependencies = [
    "google-adk==1.16.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "httpx>=0.28.0",
]
